# Render blueprint on the free plan: API and AI agent as two free web services. PostgreSQL is on Neon.
# Free services sleep after 15 minutes idle and have no persistent disk, so evidence images last until the next restart.
# Free services cannot use the private network, so the API calls the agent on its public URL; X-Agent-Key protects it.
services:
  - type: web
    name: dev102-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: EVIDENCE_DIR
        value: /tmp/evidence
      # Neon direct connection string (host without -pooler, ?sslmode=require).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AGENT_API_KEY
        fromService:
          type: web
          name: dev102-agent
          envVarKey: AGENT_API_KEY
      # Set these in the dashboard after the first deploy.
      - key: AGENT_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: APP_DOWNLOAD_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Free Render services cannot reach SMTP ports, so real email goes through Brevo's HTTPS API.
      - key: BREVO_API_KEY
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ALERT_WEBHOOK_KEY
        sync: false
      - key: DESKTOP_RELEASE_REPO
        value: Amritansh369/DEV-102
      # Store listings of the extension; set them once it is published.
      - key: EXTENSION_CHROME_URL
        sync: false
      - key: EXTENSION_EDGE_URL
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

  - type: web
    name: dev102-agent
    runtime: docker
    dockerfilePath: ./backend-services/Dockerfile
    dockerContext: ./backend-services
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        generateValue: true
      # Optional AI vision and query checks. Free: Gemini first, Hugging Face as fallback.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: LLM_FALLBACK_MODEL
        sync: false
      - key: LLM_FALLBACK_BASE_URL
        sync: false
